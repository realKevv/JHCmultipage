<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnira - Info</title>
  <link rel="stylesheet" href="./css/info.css">
  <link rel="stylesheet" href="./css/tema.css">

</head>
<body>
  <header class="site-header">
    <nav class="container navbar">
      <a class="logo" href="./index.html">Omnira</a>

      <ul class="menu">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./prodotti.html">Prodotti</a></li>
        <li><a class="active" href="./info.html">Info</a></li>
      </ul>
    </nav>
  </header>

 <!-- parte info dell'azienda, c'è bisogno di un form per la registrazione-->
  <main>
    <section class="registrazione">
    <div class="contenitore">
      <div class="testo-registrazione">
        <h2>Crea un account</h2>
        <p>
          Registrati per ricevere aggiornamenti, offerte esclusive
          e accedere ai nostri servizi.
        </p>
      </div>

      <form class="form-registrazione">
        <div class="form-gruppo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Inserisci il tuo nome" required>
        </div>

        <div class="form-gruppo">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" placeholder="Inserisci il tuo cognome" required>
        </div>

        <div class="form-gruppo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Inserisci la tua email" required>
        </div>

        <div class="form-gruppo">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Crea una password" required>
        </div>

        <div class="form-gruppo">
          <label for="conferma">Conferma Password</label>
          <input type="password" id="conferma" placeholder="Conferma la password" required>
        </div>

        <button type="submit" class="button">
          Registrati
        </button>
      </form>
    </div>
  </section>
  </main>

  <footer class="footer">
    <div class="contenitore">
      <p>&copy; 2026 Omnira. Tutti i diritti riservati.</p>
    </div>
  </footer>

</body>
</html>
